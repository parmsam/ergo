<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Evidence-based break reminders for your eyes and posture: look far, stand tall, move often." />
    <meta name="theme-color" content="#0e1a1f" />
    <title>ergo</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = JSON.parse(localStorage.getItem('ergo:v1:settings') || '{}').theme;
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <style>
      /* Inline so the splash is styled before the bundle's CSS arrives. */
      .splash { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: #0e1a1f; color: #eef7f5; font-family: Outfit, system-ui, sans-serif; transition: opacity .45s ease; }
      [data-theme='light'] .splash { background: #f2f6f4; color: #10262a; }
      @media (prefers-color-scheme: light) { :root:not([data-theme='dark']) .splash { background: #f2f6f4; color: #10262a; } }
      .splash.out { opacity: 0; pointer-events: none; }
      .splash-inner { display: grid; justify-items: center; gap: 14px; }
      .splash svg { width: 92px; height: 92px; animation: sp-pop .7s cubic-bezier(.34,1.56,.64,1) both; }
      .splash .lid { transform-box: fill-box; transform-origin: center; animation: sp-blink .5s .65s ease-in-out both; }
      .splash-word { font-size: 2rem; font-weight: 600; letter-spacing: .04em; animation: sp-rise .6s .25s ease-out both; }
      .splash-tag { margin: 0; opacity: .6; animation: sp-rise .6s .4s ease-out both; }
      @keyframes sp-pop { from { opacity: 0; transform: scale(.6); } }
      @keyframes sp-rise { from { opacity: 0; transform: translateY(10px); } }
      @keyframes sp-blink { 50% { transform: scaleY(.1); } }
      @media (prefers-reduced-motion: reduce) { .splash svg, .splash .lid, .splash-word, .splash-tag { animation: none; } }
    </style>
  </head>
  <body>
    <div class="splash" id="splash" aria-hidden="true">
      <div class="splash-inner">
        <svg viewBox="0 0 64 64">
          <rect width="64" height="64" rx="16" fill="#16303a" />
          <g class="lid">
            <path d="M7 32c6.5-10 15-15 25-15s18.5 5 25 15c-6.5 10-15 15-25 15S13.5 42 7 32Z" fill="none" stroke="#5ee0c9" stroke-width="4" stroke-linejoin="round" />
            <circle cx="32" cy="32" r="9.5" fill="none" stroke="#ffb36b" stroke-width="4" stroke-linecap="round" stroke-dasharray="44 60" transform="rotate(-90 32 32)" />
            <circle cx="32" cy="32" r="3.2" fill="#eef7f5" />
          </g>
        </svg>
        <div class="splash-word">ergo</div>
        <p class="splash-tag">look far · stand tall · move often</p>
      </div>
    </div>
    <div class="bg" aria-hidden="true"><div class="glow g1"></div><div class="glow g2"></div></div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
